[package]
name = "scanner-node"
description = "Binding N-API do scanner do TidySpace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.13.0", default-features = false, features = ["napi8"] }
napi-derive = "3.6.9"
scanner-core = { version = "0.1.0", path = "../core" }

[build-dependencies]
napi-build = "2.5.0"
